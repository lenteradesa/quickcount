<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- ================================================================
       PEMBUNGKUS GOOGLE APPS SCRIPT (tanpa banner)
       Ganti 3 hal di bawah ini (+ judul/warna jika perlu):
       1. SCRIPT_URL  → alamat /exec Web App Google Apps Script
       2. LOGO_URL    → alamat gambar logo (PNG/SVG/JPG), bisa file di repo, mis. "logo.png"
       3. TAGLINE     → kalimat pendek di layar pembuka
       Juga ganti <title>, meta description, og:*, dan favicon di bawah
       agar tampilan saat dibagikan di WhatsApp/Facebook ikut sesuai.
       ================================================================ -->
  <!-- // rubah disini : judul tab browser -->
  <title>Lentera Desa - Quick Count</title>

  <!-- // rubah disini : deskripsi aplikasi -->
  <meta name="description" content="Dari Kita Untuk Desa">

  <!-- // rubah disini : warna bilah browser di HP (samakan dengan COLOR) -->
  <meta name="theme-color" content="#0f766e">

  <!-- // rubah disini : ikon tab browser & ikon layar utama HP -->
  <link rel="icon" href="https://i.imgur.com/gWM5r69.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/gWM5r69.png">

  <!-- Pratinjau saat link dibagikan (WhatsApp, Facebook, Telegram) -->
  <!-- // rubah disini : judul, deskripsi, dan gambar pratinjau -->
  <meta property="og:title" content="Lentera Desa - Quick Count">
  <meta property="og:description" content="Dari Kita Untuk Desa">
  <meta property="og:image" content="https://i.imgur.com/gWM5r69.png">
  <meta property="og:type" content="website">

  <script>
    const CONFIG = {
      SCRIPT_URL : "https://script.google.com/macros/s/AKfycbyaC2V9XnT38Ntq8wTcCxMqiw9MTOlKigOuTsU5eOsanO844tOYfDbwYlws92-5LAhT6w/exec", // rubah disini : alamat /exec Web App
      APP_NAME   : "Lentera Desa - Quick Count",                  // rubah disini : nama aplikasi di layar pembuka
      TAGLINE    : "Dari Kita Untuk Desa",  // rubah disini : tagline di bawah nama
      LOGO_URL   : "https://i.imgur.com/gWM5r69.png",                       // rubah disini : nama file / alamat logo
      COLOR      : "#0f766e",   // rubah disini : warna utama (loader & tombol)
      BG         : "#ffffff",   // rubah disini (opsional) : warna latar layar pembuka
      TIMEOUT_MS : 20000        // (opsional) jika lebih dari ini belum termuat, tampilkan tombol bantuan
    };
    // ===== SELESAI. Bagian di bawah ini TIDAK PERLU diubah =====
  </script>

  <style>
    :root { --c: #0f766e; --bg: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh;
      border: 0; display: block; opacity: 0; transition: opacity .4s ease; }
    #app.ready { opacity: 1; }

    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 24px;
      background: var(--bg); text-align: center; transition: opacity .45s ease, visibility .45s; }
    #splash.hide { opacity: 0; visibility: hidden; }

    #logo { width: 96px; height: 96px; object-fit: contain; border-radius: 20px;
      animation: pop .7s ease both; }
    #name { font-size: 1.35rem; font-weight: 700; color: #111827; }
    #tagline { font-size: .95rem; color: #6b7280; max-width: 340px; line-height: 1.5; }

    .bar { width: 160px; height: 4px; border-radius: 4px; background: #e5e7eb;
      overflow: hidden; margin-top: 10px; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: var(--c); animation: slide 1.1s ease-in-out infinite; }

    #help { display: none; margin-top: 14px; font-size: .88rem; color: #6b7280; }
    #help.show { display: block; }
    #help a, #help button { display: inline-block; margin: 8px 4px 0; padding: 9px 16px;
      border-radius: 8px; border: 0; font: inherit; font-weight: 600; cursor: pointer;
      text-decoration: none; }
    #help .primary { background: var(--c); color: #fff; }
    #help .ghost { background: #f3f4f6; color: #111827; }

    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @media (prefers-color-scheme: dark) {
      :root:not([data-fixed]) #name { color: #f9fafb; }
    }
  </style>
</head>
<body>

  <div id="splash">
    <img id="logo" alt="Logo">
    <div id="name"></div>
    <div id="tagline"></div>
    <div class="bar"></div>
    <div id="help">
      Memuat lebih lama dari biasanya.<br>
      <button class="ghost" onclick="location.reload()">Muat ulang</button>
      <a class="primary" id="openNew" target="_blank" rel="noopener">Buka langsung</a>
    </div>
  </div>

  <iframe id="app"
    title="Aplikasi"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; autoplay"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    (function () {
      const root = document.documentElement;
      root.style.setProperty("--c", CONFIG.COLOR);
      root.style.setProperty("--bg", CONFIG.BG);

      document.getElementById("logo").src = CONFIG.LOGO_URL;
      document.getElementById("name").textContent = CONFIG.APP_NAME;
      document.getElementById("tagline").textContent = CONFIG.TAGLINE;
      document.title = CONFIG.APP_NAME;

      // Teruskan parameter URL (mis. ?page=admin) dan #hash ke Apps Script
      // Contoh: https://user.github.io/app/?page=admin  →  .../exec?page=admin
      const target = new URL(CONFIG.SCRIPT_URL);
      new URLSearchParams(location.search).forEach((v, k) => target.searchParams.set(k, v));
      if (location.hash) target.hash = location.hash;
      const finalUrl = target.toString();

      const app = document.getElementById("app");
      const splash = document.getElementById("splash");
      const help = document.getElementById("help");
      document.getElementById("openNew").href = finalUrl;

      let loaded = false;
      app.addEventListener("load", function () {
        if (loaded) return;
        loaded = true;
        app.classList.add("ready");
        setTimeout(() => splash.classList.add("hide"), 250);
      });

      setTimeout(() => { if (!loaded) help.classList.add("show"); }, CONFIG.TIMEOUT_MS);

      app.src = finalUrl;
    })();
  </script>
</body>
</html>
