<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitung Suara · Lentera Desa</title>
<meta name="description" content="Penghitungan suara pemilu real-time — Presiden, DPR, DPD, DPRD, Kepala Daerah, Pilkades. Dikembangkan oleh Lentera Desa.">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitung Suara">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Pratinjau saat link dibagikan (WhatsApp, Facebook, Telegram) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Hitung Suara · Lentera Desa">
<meta property="og:description" content="Pantau hasil penghitungan suara secara real-time dari setiap TPS.">
<meta property="og:image" content="https://i.imgur.com/jr8apj9.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="https://i.imgur.com/jr8apj9.png">
<link rel="apple-touch-icon" href="https://i.imgur.com/jr8apj9.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --pri:#1e3a8a; --pri2:#2563eb; --bg:#f1f5f9; --ink:#0f172a; --muted:#64748b; }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink) }
  /* aplikasi memenuhi seluruh layar */
  #app{ position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:var(--bg) }

  /* layar pembuka */
  #splash{ position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; background:radial-gradient(1200px 600px at 50% -10%,#dbeafe 0%,var(--bg) 60%);
    transition:opacity .45s ease, visibility .45s ease }
  #splash.hide{ opacity:0; visibility:hidden }
  #splash img{ width:110px; height:110px; object-fit:contain; filter:drop-shadow(0 8px 18px rgba(30,58,138,.18));
    animation:float 2.4s ease-in-out infinite }
  @keyframes float{ 50%{ transform:translateY(-6px) } }
  .tag{ font-size:11px; font-weight:800; letter-spacing:2.5px; color:#b45309 }
  h1{ margin:0; font-size:22px; color:var(--pri) }
  .sub{ margin:0; color:var(--muted); font-size:14px; font-weight:500 }
  .bar{ width:180px; height:4px; border-radius:99px; background:#cbd5e1; overflow:hidden; margin-top:6px }
  .bar i{ display:block; width:40%; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--pri),var(--pri2));
    animation:load 1.1s ease-in-out infinite }
  @keyframes load{ 0%{ transform:translateX(-100%) } 100%{ transform:translateX(260%) } }
  #status{ min-height:20px; font-size:13px; color:var(--muted) }
  .actions{ display:none; gap:10px; flex-wrap:wrap; justify-content:center }
  .actions.show{ display:flex }
  .btn{ border:0; border-radius:10px; padding:10px 16px; font:inherit; font-weight:700; font-size:14px; cursor:pointer;
    background:var(--pri2); color:#fff; text-decoration:none }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid #e2e8f0 }
  .foot{ position:absolute; bottom:18px; font-size:12px; color:var(--muted) }
  .foot b{ color:var(--ink) }

  /* pita offline */
  #offline{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%) translateY(200px); z-index:20;
    background:#0f172a; color:#fff; padding:9px 16px; border-radius:99px; font-size:13px; font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.25); transition:transform .3s ease }
  #offline.show{ transform:translateX(-50%) translateY(0) }
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite">
  <img src="https://i.imgur.com/jr8apj9.png" alt="Lentera Desa" onerror="this.style.display='none'">
  <div class="tag">LENTERA DESA</div>
  <h1>Hitung Suara</h1>
  <p class="sub">Penghitungan suara real-time</p>
  <div class="bar" id="bar"><i></i></div>
  <div id="status">Menyiapkan aplikasi…</div>
  <div class="actions" id="actions">
    <button class="btn" onclick="muatUlang()">↻ Muat ulang</button>
    <a class="btn ghost" id="direct" href="#" target="_blank" rel="noopener">Buka langsung</a>
  </div>
  <div class="foot">© <span id="yr"></span> <b>Lentera Desa</b></div>
</div>

<div id="offline">⚠ Tidak ada koneksi internet</div>

<noscript>
  <p style="padding:24px;text-align:center">Aktifkan JavaScript untuk membuka aplikasi ini.</p>
</noscript>

<script>
/* ================== PENGATURAN — CUKUP UBAH BARIS INI ==================
 * Tempel link Web App Apps Script Anda (Terapkan → Kelola deployment → URL web app).
 * Harus berakhiran /exec  (bukan /dev).
 */
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyaC2V9XnT38Ntq8wTcCxMqiw9MTOlKigOuTsU5eOsanO844tOYfDbwYlws92-5LAhT6w/exec';
/* ===================================================================== */

(function () {
  var splash = document.getElementById('splash');
  var status = document.getElementById('status');
  var actions = document.getElementById('actions');
  var direct = document.getElementById('direct');
  document.getElementById('yr').textContent = new Date().getFullYear();

  // teruskan parameter URL (mis. ?page=admin) ke web app
  var url = WEBAPP_URL + (location.search || '') + (location.hash || '');
  direct.href = url;

  if (/GANTI_DENGAN_ID/.test(WEBAPP_URL)) {
    status.innerHTML = '⚙️ Pembungkus belum dikonfigurasi.<br>Isi <b>WEBAPP_URL</b> di file <code>index.html</code>.';
    document.getElementById('bar').style.display = 'none';
    return;
  }

  var frame = document.createElement('iframe');
  frame.id = 'app';
  frame.title = 'Hitung Suara · Lentera Desa';
  frame.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen; camera; geolocation; web-share');
  frame.setAttribute('allowfullscreen', '');
  frame.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
  var loaded = false;

  frame.onload = function () {
    loaded = true;
    // beri jeda singkat agar tampilan aplikasi sudah tergambar sebelum layar pembuka hilang
    setTimeout(function () { splash.classList.add('hide'); }, 600);
  };
  frame.src = url;
  document.body.insertBefore(frame, splash);

  var pesan = ['Menghubungi server…', 'Memuat data penghitungan…', 'Hampir selesai…'];
  var i = 0;
  var tick = setInterval(function () {
    if (loaded) return clearInterval(tick);
    status.textContent = pesan[Math.min(i++, pesan.length - 1)];
  }, 2500);

  // bila terlalu lama, tawarkan muat ulang / buka langsung
  setTimeout(function () {
    if (loaded) return;
    status.textContent = 'Koneksi lambat. Aplikasi masih dimuat…';
    actions.classList.add('show');
  }, 20000);

  window.muatUlang = function () {
    status.textContent = 'Memuat ulang…';
    actions.classList.remove('show');
    splash.classList.remove('hide');
    loaded = false;
    frame.src = url.indexOf('?') >= 0 ? url + '&_r=' + Date.now() : url + '?_r=' + Date.now();
  };

  // pita offline
  var off = document.getElementById('offline');
  function cekOnline() { off.classList.toggle('show', !navigator.onLine); }
  window.addEventListener('online', cekOnline);
  window.addEventListener('offline', cekOnline);
  cekOnline();

  // bisa dipasang seperti aplikasi (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
